name: mac
on: 
  workflow_dispatch:
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    - name: Setting the environment up.
      env:
        VNC_USER_PASSWORD: ${{ secrets.VNC_USER_PASSWORD }}
        VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      run: source configure.sh "$VNC_USER_PASSWORD" "$VNC_PASSWORD"
    - name: VNC address
      run: |
        for i in $(seq 1 30); do
          addr=$(grep -o 'bore.pub:[0-9]*' /tmp/bore.log | head -n 1)
          [ -n "$addr" ] && break
          sleep 2
        done
        echo "you can VNC to... $addr"
        [ -n "$addr" ] || { cat /tmp/bore.log; exit 1; }
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v2
